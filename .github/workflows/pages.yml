name: Docs (GitHub Pages)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout docs storage branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: docs-store

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' MeowAutoChrome.Contracts/MeowAutoChrome.Contracts.csproj)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Doc version: $version"

      - name: Build docs
        run: docfx docfx.json

      - name: Inject site extras
        run: python .github/scripts/inject_site_extras.py _site .github/pages-root/custom.css .github/pages-root/version-switcher.js

      - name: Assemble site
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          mkdir -p public

          # carry over previously published versions
          if [ -d docs-store ]; then
            rsync -a --exclude='.git' docs-store/ public/
          fi

          rm -rf "public/${version}" public/latest
          mkdir -p "public/${version}" public/latest
          cp -a _site/. "public/${version}/"
          cp -a _site/. "public/latest/"

          cp .github/pages-root/index.html public/index.html
          cp .github/pages-root/version-switcher.js public/version-switcher.js
          touch public/.nojekyll

          versions="$(ls public | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          json="$(printf '%s\n' "$versions" | grep -v '^$' | sort -uVr | sed 's/.*/"&"/' | paste -sd, -)"
          printf '[%s]\n' "$json" > public/versions.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Save docs storage branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
          commit_message: 'docs: update pages store'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
